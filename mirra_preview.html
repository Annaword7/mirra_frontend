<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MiRRA — Product Collection</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(ellipse at 30% 20%, #1e2a4a 0%, #0d0d1a 60%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  }

  /* ── Phone frame ── */
  .phone {
    width: 390px;
    height: 844px;
    background: #EBF0FC;
    border-radius: 54px;
    box-shadow:
      0 0 0 2px #2a2a3a,
      0 0 0 8px #111118,
      0 0 0 10px #2a2a3a,
      0 60px 120px rgba(0,0,0,0.8);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .dynamic-island {
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    width: 126px; height: 37px;
    background: #000;
    border-radius: 20px;
    z-index: 100;
  }

  .screen {
    position: absolute;
    inset: 0;
    border-radius: 54px;
    overflow: hidden;
    background: #EBF0FC;
  }

  /* Status bar */
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 59px;
    background: #EBF0FC; z-index: 50;
    display: flex; align-items: flex-end;
    padding: 0 28px 8px; justify-content: space-between;
  }
  .status-time { font-size: 15px; font-weight: 700; color: #1A1A1A; }
  .status-icons { display: flex; gap: 6px; align-items: center; }

  /* Top bar */
  .top-bar {
    position: absolute; top: 59px; left: 0; right: 0; height: 56px;
    background: #EBF0FC; z-index: 50;
    display: flex; align-items: center; padding: 0 20px;
    justify-content: space-between;
    border-bottom: 1px solid rgba(92,133,217,0.12);
  }
  .avatar {
    width: 40px; height: 40px; background: #5C85D9; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: white; font-weight: 700;
  }
  .top-bar-title { font-size: 18px; font-weight: 700; color: #1A1A1A; }
  .fav-btn {
    width: 40px; height: 40px; background: #5C85D9; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  /* Scroll */
  .scroll-container {
    position: absolute; top: 115px; left: 0; right: 0; bottom: 80px;
    overflow: hidden;
  }
  .scroll-track {
    display: flex; flex-direction: column;
    padding: 12px 12px 0;
    will-change: transform;
  }
  .masonry {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .masonry-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ── Card ── */
  .card {
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.13);
    display: flex;
    flex-direction: column;
  }

  /* Image area with score badge overlay */
  .card-img-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: white;
    flex-shrink: 0;
  }
  .card-img-wrap img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    border-radius: 16px;
    margin: 8px;
    width: calc(100% - 16px);
    height: calc(100% - 16px);
  }
  .card-placeholder {
    position: absolute; inset: 8px;
    border-radius: 16px;
    background: linear-gradient(135deg, #f0f4ff, #e8edf8);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }

  /* Score badge — white pill, top-left over image */
  .score-badge {
    position: absolute; top: 16px; left: 16px;
    background: rgba(255,255,255,0.93);
    border-radius: 14px;
    padding: 5px 9px 5px 5px;
    display: flex; align-items: center; gap: 7px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .score-text {
    font-size: 12px; font-weight: 700;
    line-height: 1;
  }

  /* Circular arc drawn in SVG */
  .arc-wrap { position: relative; width: 34px; height: 34px; flex-shrink: 0; }
  .arc-wrap svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .arc-bg   { fill: none; }
  .arc-fill { fill: none; stroke-linecap: round; }
  .arc-letter {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; line-height: 1;
  }

  /* Card body */
  .card-body {
    padding: 6px 10px 8px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .card-brand {
    font-size: 10px; font-weight: 600;
    color: #5C85D9;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-name {
    font-size: 12px; font-weight: 600; color: #1A1A1A;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-tags {
    display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px;
  }
  .tag {
    background: #F2EBB4;
    border-radius: 16px;
    padding: 3px 8px;
    font-size: 9px; font-weight: 500; color: #5a4e00;
    white-space: nowrap;
  }

  /* Navbar */
  .navbar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
    background: white; border-top: 1px solid rgba(0,0,0,0.07);
    display: flex; align-items: flex-start; padding-top: 10px;
    justify-content: space-around; z-index: 50;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; flex: 1;
  }
  .nav-item svg { width: 23px; height: 23px; }
  .nav-item span { font-size: 10px; font-weight: 500; color: #929292; }
  .nav-item.active svg { fill: #5C85D9; }
  .nav-item.active span { color: #5C85D9; }
  .nav-item:not(.active) svg { fill: #929292; }

  .fab {
    position: absolute; bottom: 22px; left: 50%;
    transform: translateX(-50%);
    width: 52px; height: 52px; background: #5C85D9; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(92,133,217,0.5); z-index: 60;
  }
  .fab svg { width: 24px; height: 24px; fill: white; }

  .loading {
    display: flex; justify-content: center; align-items: center;
    height: 100%; flex-direction: column; gap: 12px;
    color: #929292; font-size: 14px;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #CBDDFE; border-top-color: #5C85D9;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="phone">
  <div class="dynamic-island"></div>
  <div class="screen">

    <div class="status-bar">
      <span class="status-time">14:23</span>
      <div class="status-icons">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="#1A1A1A"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="0.5"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.5"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" opacity="0.3"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="#1A1A1A"><path d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"/><path d="M8 5.5C5.8 5.5 3.8 6.4 2.4 7.9l1.4 1.4C4.9 8.2 6.4 7.5 8 7.5s3.1.7 4.2 1.8l1.4-1.4C12.2 6.4 10.2 5.5 8 5.5z"/><path d="M8 1.5C4.7 1.5 1.7 2.9 0 5.1l1.4 1.4C2.8 4.5 5.2 3.5 8 3.5s5.2 1 6.6 3l1.4-1.4C14.3 2.9 11.3 1.5 8 1.5z"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="#1A1A1A"><rect x="0" y="1" width="21" height="10" rx="3" stroke="#1A1A1A" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="16" height="7" rx="2"/><rect x="22" y="3.5" width="2.5" height="5" rx="1.2"/></svg>
      </div>
    </div>

    <div class="top-bar">
      <div class="avatar">A</div>
      <span class="top-bar-title">My Products</span>
      <div class="fav-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
    </div>

    <div class="scroll-container">
      <div class="scroll-track" id="scrollTrack">
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <span>Loading products…</span>
        </div>
      </div>
    </div>

    <div class="navbar">
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span>Home</span>
      </div>
      <div class="nav-item active">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Collection</span>
      </div>
      <div style="flex:1.4"></div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>
        <span>Top</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span>Profile</span>
      </div>
    </div>

    <div class="fab">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z" fill="none" stroke="white" stroke-width="2"/><circle cx="12" cy="13" r="4" fill="none" stroke="white" stroke-width="2"/></svg>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://pjapsfbztorijypnldam.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqYXBzZmJ6dG9yaWp5cG5sZGFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQzNjY0ODEsImV4cCI6MjA1OTk0MjQ4MX0.aMFtS5zXK-psMT6gfdg67Zx6qdUrzWD-zqihjUvEtZU';
const USER_ID  = '8e2ba867-0c96-4659-bf59-859d425fdf19';
const SPEED    = 38; // px/sec

// ── Score helpers (mirrors Flutter _ScoreBadge) ──────────────────────
function scoreColor(s) {
  if (s >= 75) return '#1B5E20';
  if (s >= 65) return '#43A047';
  if (s >= 55) return '#C0CA33';
  if (s >= 45) return '#FFB300';
  if (s >= 35) return '#FF7043';
  return '#D32F2F';
}
function scoreGrade(s) {
  if (s >= 75) return 'A';
  if (s >= 65) return 'B';
  if (s >= 55) return 'C';
  if (s >= 45) return 'D';
  if (s >= 35) return 'E';
  return 'F';
}

// ── Circular arc SVG ─────────────────────────────────────────────────
// r=14, cx=cy=17, circumference = 2π·14 ≈ 87.96
function arcSVG(score) {
  const color  = scoreColor(score);
  const grade  = scoreGrade(score);
  const r      = 14;
  const cx     = 17;
  const circ   = 2 * Math.PI * r;
  const filled = (score / 100) * circ;
  const bgColor = color + '26'; // ~15% opacity

  return `
    <div class="arc-wrap">
      <svg viewBox="0 0 34 34" width="34" height="34">
        <circle class="arc-bg" cx="${cx}" cy="${cx}" r="${r}"
          stroke="${bgColor}" stroke-width="3.5"/>
        <circle class="arc-fill" cx="${cx}" cy="${cx}" r="${r}"
          stroke="${color}" stroke-width="3.5"
          stroke-dasharray="${filled} ${circ - filled}"/>
      </svg>
      <div class="arc-letter" style="color:${color}">${grade}</div>
    </div>`;
}

// ── Card HTML ─────────────────────────────────────────────────────────
function cardHTML(p) {
  const score  = p.sa_composite_score ?? 0;
  const color  = scoreColor(score);
  const name   = p.product_name || 'Unknown product';
  const brand  = p.brand || '';
  const tags = Array.isArray(p.skin_type_tags) ? p.skin_type_tags.slice(0, 3) : [];

  const tagHTML = tags.length
    ? `<div class="card-tags">${tags.map(t =>
        `<span class="tag">${t}</span>`).join('')}</div>`
    : '';

  const imgHTML = p.image_url
    ? `<img src="${p.image_url}" alt="" loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';

  return `
    <div class="card">
      <div class="card-img-wrap">
        ${imgHTML}
        <div class="card-placeholder" ${p.image_url ? 'style="display:none"' : ''}>🧴</div>
        <div class="score-badge">
          ${arcSVG(score)}
          <span class="score-text" style="color:${color}">${Math.round(score)}<span style="font-weight:400;color:#929292">/100</span></span>
        </div>
      </div>
      <div class="card-body">
        ${brand ? `<div class="card-brand">${brand}</div>` : ''}
        <div class="card-name">${name}</div>
        ${tagHTML}
      </div>
    </div>`;
}

function buildGrid(products) {
  const left  = products.filter((_, i) => i % 2 === 0).map(cardHTML).join('');
  const right = products.filter((_, i) => i % 2 === 1).map(cardHTML).join('');
  return `<div class="masonry">
    <div class="masonry-col">${left}</div>
    <div class="masonry-col">${right}</div>
  </div>`;
}

async function init() {
  const url = `${SUPABASE_URL}/rest/v1/images`
    + `?user=eq.${USER_ID}&hided=neq.true`
    + `&select=id,image_url,product_name,brand,sa_composite_score,skin_type_tags`
    + `&order=created_at.desc&limit=200`;

  const res  = await fetch(url, {
    headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` }
  });
  const products = await res.json();
  const track    = document.getElementById('scrollTrack');

  if (!products.length) {
    track.innerHTML = '<div class="loading"><span>No products found</span></div>';
    return;
  }

  const grid = buildGrid(products);
  track.innerHTML = grid + grid; // duplicate for seamless loop

  // Wait one frame so heights are calculated
  requestAnimationFrame(() => {
    const singleH = track.scrollHeight / 2;
    let offset = 0, last = null;

    function step(ts) {
      if (last !== null) {
        offset += SPEED * (ts - last) / 1000;
        if (offset >= singleH) offset -= singleH;
        track.style.transform = `translateY(-${offset}px)`;
      }
      last = ts;
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

init();
</script>
</body>
</html>
